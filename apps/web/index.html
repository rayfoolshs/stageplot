<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StagePlot by Ray Foo</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the
      // wrong palette while React boots. Light is the default; the versioned
      // key ignores older auto-saved values.
      (function () {
        try {
          var saved = localStorage.getItem("stageplot:theme:v2");
          var theme = saved === "light" || saved === "dark" ? saved : "light";
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage can be unavailable; fall back to the CSS default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
